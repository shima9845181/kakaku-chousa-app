            <div className="font-semibold text-sm mb-1">自動バックアップ（ファイルへ自動保存）</div>
            {fs.name
              ? (fs.ready
                ? <div className="text-sm text-emerald-700">✅ 有効：{fs.name}{fs.lastWrite ? <span className="text-xs text-slate-400">（最終書込 {new Date(fs.lastWrite).toLocaleString("ja-JP")}）</span> : null}</div>
                : <div className="text-sm text-amber-600">⚠ 権限が切れています：{fs.name} — 「再有効化」を押してください</div>)
              : <div className="text-sm text-amber-600">未設定です。保存先ファイルを一度設定すると、以後データ変更のたびに自動で書き出します。</div>}
            <div className="flex gap-1.5 flex-wrap mt-1.5">
              <Btn variant="primary" onClick={onSetupFs}>📂 保存先を{fs.name ? "変更" : "設定"}</Btn>
              {fs.name && !fs.ready && <Btn variant="primary" onClick={onEnableFs}>🔓 再有効化</Btn>}
              {fs.name && <Btn onClick={onFsWriteNow} disabled={!fs.ready}>💾 今すぐ書き出し</Btn>}
              {fs.name && <Btn onClick={onRestoreHandle}>♻ 保存先から復元</Btn>}
              <Btn onClick={onRestorePicker}>📄 ファイルを選んで復元</Btn>
            </div>
            <div className="text-xs text-slate-400 mt-1">保存先をGoogleドライブ内のフォルダにすると遠隔バックアップになります。起動時に保存先の方が新しければ自動で復元します（新しいローカル編集は巻き戻しません）。空データでの上書きは自動で防ぎます。</div>
          </div>
        ) : <div className="text-xs text-amber-600 mb-2">このブラウザは自動保存（実ファイル書き出し）非対応です。下の手動バックアップをご利用ください。</div>}
        <div className="border border-slate-200 rounded p-2.5 mb-2">
          <div className="font-semibold text-sm mb-1">手動バックアップ</div>
          <div className="flex gap-1.5 flex-wrap">
            <Btn onClick={onExportAll}>💾 全データを書き出し（JSON）</Btn>
            <Btn onClick={() => bakRef.current && bakRef.current.click()}>📂 バックアップから復元</Btn>
            <input ref={bakRef} type="file" accept=".json" data-role="backup-restore" className="hidden" onChange={(e) => { if (e.target.files[0]) onImportAll(e.target.files[0]); e.target.value = ""; }} />
            {lastBackup ? <span className="text-xs text-slate-400 self-center">最終書き出し：{new Date(lastBackup).toLocaleString("ja-JP")}</span> : null}
          </div>
          <div className="text-xs text-slate-400 mt-1">案件・設定・取込済み材料マスタを1つのJSONに書き出します（自動保存と同じ内容）。</div>
        </div>
        <div className="border border-slate-200 rounded p-2.5">
          <div className="font-semibold text-sm mb-1">世代バックアップ（このブラウザ内・自動）</div>
          <div className="text-xs text-slate-400 mb-1">案件一覧を保存のたびに日時付きで最大10世代保持します（件数が急減する変化は追記せず古い世代を保護）。起動時に失われた案件を自動で復旧します。</div>
          {gens.length
            ? <div className="text-sm text-slate-600">保持中：{gens.length} 世代（最新 {gens[0].at}・{gens[0].count}件）</div>
            : <div className="text-sm text-slate-400">まだ世代はありません（案件を保存すると作られます）</div>}
          <div className="mt-1.5"><Btn onClick={onRecoverGens} disabled={!gens.length}>♻ 世代から失われた案件を復旧</Btn></div>
        </div>
      </Card>
    </div>
  );
}

// ================= 履歴モーダル =================
function HistModal({ item, history, onClose }) {
  const key = norm(item.model || "");
  const rows = (history || []).filter((h) => key ? norm(h.model) === key : norm(h.name) === norm(item.name)).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  // 上書きせず残した全記録から、いつ最安・いつ最高だったかを出す
  const priced = rows.filter((h) => num(h.price) > 0);
  const lo = priced.length ? priced.reduce((m, h) => (num(h.price) < num(m.price) ? h : m), priced[0]) : null;
  const hi = priced.length ? priced.reduce((m, h) => (num(h.price) > num(m.price) ? h : m), priced[0]) : null;
  const vendorsN = new Set(priced.map((h) => h.vendor)).size;
  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-lg shadow-xl max-w-5xl w-full max-h-[85vh] overflow-auto p-4" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center mb-2">
          <div className="font-semibold">📈 仕入履歴：{item.name} <span className="font-mono text-sm text-slate-500">{item.model}</span></div>
          <Btn variant="ghost" className="ml-auto" onClick={onClose}>✕ 閉じる</Btn>
        </div>
        {lo && (
          <div className="text-sm mb-2 flex gap-4 flex-wrap">
            <span>記録 <b>{priced.length}</b>回／仕入先 <b>{vendorsN}</b>社</span>
            <span className="text-emerald-700">★最安 <b>{yen(lo.price)}円</b> <span className="text-xs">{lo.date} {lo.vendor}</span></span>
            {hi !== lo && <span className="text-rose-700">▲最高 <b>{yen(hi.price)}円</b> <span className="text-xs">{hi.date} {hi.vendor}</span>（差 {yen(num(hi.price) - num(lo.price))}円）</span>}
            <span className="text-slate-500">最新（見積に使う値）: <b className="text-slate-800">{yen(rows[0].price)}円</b> <span className="text-xs">{rows[0].date} {rows[0].vendor}</span></span>
          </div>
        )}
        {rows.length ? (
          <table className="tbl text-sm w-full whitespace-nowrap">
            <thead><tr><th>仕入日</th><th>仕入先</th><th>数量</th><th>単位</th><th>単価</th><th>金額</th><th>現場</th><th>取込</th></tr></thead>
            <tbody>{rows.map((h, i) => (
              <tr key={i} className={h === lo ? "bg-emerald-50" : (h === hi && hi !== lo ? "bg-rose-50" : "")}><td>{h.date}</td><td>{h.vendor}</td><td className="text-right">{h.qty}</td><td className="text-center">{h.unit}</td>
                <td className="text-right font-semibold">{yen(h.price)}{h === lo ? <span className="text-xs text-emerald-700 ml-1">★最安</span> : null}{h === hi && hi !== lo ? <span className="text-xs text-rose-700 ml-1">▲最高</span> : null}</td><td className="text-right">{yen(h.amt)}</td><td className="max-w-[14rem] truncate" title={h.site}>{h.site}</td>
                <td className="text-xs text-slate-500 max-w-[14rem] truncate" title={h.src}>{h.imported ? h.imported + " " : ""}{h.src}</td></tr>
            ))}</tbody>
          </table>
        ) : <div className="text-slate-400 text-sm py-4 text-center">この品目の履歴は見つかりません</div>}
      </div>
    </div>
  );
}

// ================= 仕入先タブ（取り込んだ仕入価格を全部、種別ごとに見る。2026-09-18） =================
// 「いつ・どこから・いくらで入ったか」を、上書きせず残してある単価履歴からそのまま並べる。
// 見積に使うのは最新値だけだが、ここでは過去の記録も全部見られる（いつ最安・いつ最高だったか）。
const shiireKey = (h) => norm(h.model || "") || ("#" + norm(h.name || ""));
const ymd = (s) => String(s || "").slice(0, 10);

function ShiireTab({ zairyo, onShowHist, onAddRow }) {
  const [q, setQ] = useState("");
  const [cat, setCat] = useState("");        // 分類でしぼる（空＝全部）
  const [ven, setVen] = useState("");        // 仕入先でしぼる
  const [mode, setMode] = useState("item");  // item=品目ごと / flat=記録を全部
  const [openCat, setOpenCat] = useState({});

  const hist = zairyo.history || [];
  const catOf = useMemo(() => {
    const m = {};
    (zairyo.items || []).forEach((x) => { const k = norm(x.model || "") || ("#" + norm(x.name || "")); if (k && !m[k]) m[k] = x.cat || ""; });
    return m;
  }, [zairyo.items]);

  // 仕入先ごとのまとめ（何件・何品目・いつからいつまで）
  const vendors = useMemo(() => {
    const m = {};
    hist.forEach((h) => {
      const v = (h.vendor || "").trim(); if (!v) return;
      const o = m[v] || (m[v] = { name: v, n: 0, items: new Set(), min: "", max: "", amt: 0 });
      o.n++; o.items.add(shiireKey(h));
      const d = ymd(h.date);
      if (d && (!o.min || d < o.min)) o.min = d;
      if (d && (!o.max || d > o.max)) o.max = d;
      o.amt += num(h.amt);
    });
    return Object.values(m).sort((a, b) => b.n - a.n);
  }, [hist]);

  const toks = useMemo(() => tokens(q), [q]);
  const shown = useMemo(() => hist.filter((h) => {
    if (ven && (h.vendor || "").trim() !== ven) return false;
    const c = catOf[shiireKey(h)] || "";
    if (cat && (c || "（分類なし）") !== cat) return false;
    if (toks.length && !hitAll(norm([h.maker, h.model, h.name, h.vendor, h.site, c].join("␟")), toks)) return false;
    return true;
  }), [hist, ven, cat, toks, catOf]);

  // 分類ごと → 品目ごと にまとめる
  const grouped = useMemo(() => {
    const items = {};
    shown.forEach((h) => {
      const k = shiireKey(h); if (!k || !(num(h.price) > 0)) return;
      const it = items[k] || (items[k] = { key: k, model: h.model, name: h.name, maker: h.maker, unit: h.unit,
                                           cat: catOf[k] || "（分類なし）", rows: [], vendors: {} });
      it.rows.push(h);
      const v = (h.vendor || "").trim();
      const cur = it.vendors[v];
      if (v && (!cur || ymd(h.date) > cur.date)) it.vendors[v] = { date: ymd(h.date), price: num(h.price) };
    });
    Object.values(items).forEach((it) => {
      it.rows.sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const ps = it.rows.map((r) => num(r.price)).filter((p) => p > 0);
      it.lo = Math.min.apply(null, ps); it.hi = Math.max.apply(null, ps);
      it.loRow = it.rows.filter((r) => num(r.price) === it.lo)[0];
      it.hiRow = it.rows.filter((r) => num(r.price) === it.hi)[0];
      it.newest = it.rows[0];
      it.vs = Object.keys(it.vendors).map((n2) => ({ name: n2, ...it.vendors[n2] })).sort((a, b) => a.price - b.price);
    });
    const byCat = {};
    Object.values(items).forEach((it) => { (byCat[it.cat] || (byCat[it.cat] = [])).push(it); });
    return Object.keys(byCat).map((c) => ({
      cat: c, items: byCat[c].sort((a, b) => String(a.model || a.name).localeCompare(String(b.model || b.name))),
      n: byCat[c].reduce((a, it) => a + it.rows.length, 0),
    })).sort((a, b) => b.items.length - a.items.length);
  }, [shown, catOf]);

  const catList = useMemo(() => {
    const m = {};
    hist.forEach((h) => { const c = catOf[shiireKey(h)] || "（分類なし）"; m[c] = (m[c] || 0) + 1; });
    return Object.keys(m).map((c) => ({ cat: c, n: m[c] })).sort((a, b) => b.n - a.n);
  }, [hist, catOf]);

  // 開いている種別かどうか。種別をしぼったとき・種別が少ないときは最初から開く
  const isOpen = (g) => (openCat[g.cat] !== undefined ? !!openCat[g.cat] : (!!cat || grouped.length <= 3));
  const flat = useMemo(() => shown.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))), [shown]);
  const FLIM = 400;

  const toCsv = () => {
    const head = ["仕入日", "仕入先", "分類", "メーカ", "型番", "品名", "数量", "単位", "単価", "金額", "現場", "取込日", "出典"];
    const esc = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const body = flat.map((h) => [ymd(h.date), h.vendor, catOf[shiireKey(h)] || "", h.maker, h.model, h.name,
                                  h.qty, h.unit, num(h.price) || "", num(h.amt) || "", h.site, h.imported || "", h.src || ""].map(esc).join(","));
    const blob = new Blob(["﻿" + [head.map(esc).join(",")].concat(body).join("\r\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "仕入価格の記録_" + ymdStr() + ".csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  if (!hist.length) {
    return <Card title="🏪 仕入先の記録">
      <div className="text-sm text-slate-500">まだ仕入の記録がありません。設定タブで <b>材料マスタ.xlsx</b> を取り込むと、単価履歴（いつ・どこから・いくらで入ったか）がここに出ます。</div>
    </Card>;
  }

  return (
    <div className="space-y-3">
      <Card title={"🏪 仕入先ごとの実績（記録 " + hist.length.toLocaleString() + " 行）"}
        right={<Btn onClick={toCsv} title="いま出ている記録をCSVにする">⬇ CSVに出す</Btn>}>
        <div className="flex gap-2 flex-wrap">
          {vendors.map((v) => (
            <button key={v.name} type="button" onClick={() => setVen(ven === v.name ? "" : v.name)}
              className={"text-left border rounded px-2.5 py-1.5 " + (ven === v.name ? "border-cyan-500 bg-cyan-50" : "border-slate-200 hover:bg-slate-50")}>
              <div className="font-semibold text-sm">{v.name}</div>
              <div className="text-xs text-slate-500">{v.n.toLocaleString()}行 ／ {v.items.size}品目<br />{v.min} 〜 {v.max}</div>
            </button>
          ))}
          {ven && <Btn variant="ghost" onClick={() => setVen("")}>✕ 仕入先のしぼり込みを外す</Btn>}
        </div>
        <div className="text-xs text-slate-400 mt-2">仕入先を押すとその会社の分だけになります。金額は取り込んだ見積・請求の単価そのままで、<b>上書きせず全部残しています</b>。</div>
      </Card>

      <Card>
        <div className="flex gap-2 items-center flex-wrap">
          <span className="text-lg">🔍</span>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="型番・品名・メーカ・現場でしぼる（空白区切りでAND）"
            className="flex-1 min-w-[240px] border border-slate-300 rounded px-2.5 py-1.5 text-sm" />
          {q && <Btn variant="ghost" onClick={() => setQ("")}>✕</Btn>}
          <div className="flex gap-1">
            <Btn variant={mode === "item" ? "primary" : "sub"} onClick={() => setMode("item")}>品目ごと</Btn>
            <Btn variant={mode === "flat" ? "primary" : "sub"} onClick={() => setMode("flat")}>記録を全部</Btn>
          </div>
        </div>
        <div className="mt-2 flex gap-1 flex-wrap items-center">
          <span className="text-xs text-slate-500 mr-1">種別：</span>
          <button type="button" onClick={() => setCat("")}
            className={"text-xs px-2 py-0.5 rounded border " + (!cat ? "bg-cyan-700 text-white border-cyan-700" : "bg-white border-slate-300 text-slate-600 hover:bg-slate-50")}>全部</button>
          {catList.map((c) => (
            <button key={c.cat} type="button" onClick={() => setCat(cat === c.cat ? "" : c.cat)}
              className={"text-xs px-2 py-0.5 rounded border " + (cat === c.cat ? "bg-cyan-700 text-white border-cyan-700" : "bg-white border-slate-300 text-slate-600 hover:bg-slate-50")}>
              {c.cat}<span className="opacity-60 ml-0.5">{c.n}</span>
            </button>
          ))}
        </div>
        <div className="text-sm text-slate-600 mt-2">
          いま出ている記録 <b className="text-cyan-700">{shown.length.toLocaleString()}</b> 行 ／ 品目 <b className="text-cyan-700">{grouped.reduce((a, g) => a + g.items.length, 0).toLocaleString()}</b> 種 ／ 種別 {grouped.length}
        </div>
      </Card>

      {mode === "item" && grouped.length > 1 && (
        <div className="flex gap-1.5 flex-wrap items-center text-sm">
          <span className="text-slate-500 text-xs">種別 {grouped.length} 件：</span>
          <Btn onClick={() => { const o = {}; grouped.forEach((g) => { o[g.cat] = true; }); setOpenCat(o); }}>全部ひらく</Btn>
          <Btn onClick={() => { const o = {}; grouped.forEach((g) => { o[g.cat] = false; }); setOpenCat(o); }}>全部たたむ</Btn>
          <span className="text-xs text-slate-400">見出しを押すと開きます</span>
        </div>
      )}
      {mode === "item" ? grouped.filter(isOpen).map((g) => {
        const open = true;
        const LIM = 8;
        const list = g.items;
        const more = openCat[g.cat + "␟more"] === true;
        const view = more ? list : list.slice(0, LIM);
        return (
          <Card key={g.cat} className="cursor-default"
            title={<span className="cursor-pointer select-none" onClick={() => setOpenCat((o) => ({ ...o, [g.cat]: !open }))}>{(open ? "▼ " : "▶ ") + g.cat}<span className="font-normal text-slate-500 text-sm">（{g.items.length}品目 ／ 記録 {g.n}行）</span></span>}
            right={<Btn variant="ghost" onClick={() => setOpenCat((o) => ({ ...o, [g.cat]: !open }))}>{open ? "たたむ" : "ひらく"}</Btn>}>
            {open && <div className="overflow-x-auto"><table className="tbl text-sm w-full whitespace-nowrap">
              <thead><tr><th>型番</th><th>品名</th><th>単位</th><th>仕入先ごとの最新単価</th><th>いちばん安かった</th><th>いちばん高かった</th><th>記録</th><th></th></tr></thead>
              <tbody>{view.map((it) => (
                <tr key={it.key} className="hover:bg-cyan-50 align-top">
                  <td className="font-mono">{it.model}</td>
                  <td className="max-w-[20rem] truncate" title={it.name}>{it.name}</td>
                  <td className="text-center">{it.unit}</td>
                  <td>{it.vs.map((v, i) => (
                    <div key={v.name} className={i === 0 && it.vs.length > 1 ? "text-emerald-700 font-semibold" : "text-slate-700"}>
                      {i === 0 && it.vs.length > 1 ? "★" : ""}{v.name} {yen(v.price)}円 <span className="text-xs text-slate-500">{v.date}</span>
                    </div>
                  ))}</td>
                  <td className="text-right text-emerald-700">{yen(it.lo)}円<div className="text-xs text-slate-500">{ymd(it.loRow.date)} {it.loRow.vendor}</div></td>
                  <td className="text-right text-rose-700">{it.hi !== it.lo ? <React.Fragment>{yen(it.hi)}円<div className="text-xs text-slate-500">{ymd(it.hiRow.date)} {it.hiRow.vendor}</div></React.Fragment> : <span className="text-slate-300">—</span>}</td>
                  <td className="text-center">{it.rows.length}回</td>
                  <td className="text-center"><div className="flex gap-1">
                    <Btn variant="ghost" title="この品目の記録を全部見る" onClick={() => onShowHist({ name: it.name, model: it.model })}>📈</Btn>
                    <Btn variant="primary" title="いちばん安い仕入先・単価で見積に追加" onClick={() => onAddRow({ name: it.name, model: it.model, maker: it.maker || "", vendor: it.vs[0] ? it.vs[0].name : "", catName: it.cat, unit: it.unit, cost: it.vs[0] ? it.vs[0].price : num(it.newest.price) })}>＋</Btn>
                  </div></td>
                </tr>
              ))}</tbody>
            </table></div>}
            {open && list.length > LIM && (
              <div className="mt-1"><Btn variant="ghost" onClick={() => setOpenCat((o) => ({ ...o, [g.cat + "␟more"]: !more }))}>
                {more ? "…少なく表示" : "…ほか " + (list.length - LIM) + " 品目を見る"}</Btn></div>
            )}
          </Card>
        );
      }) : null}

      {/* たたんである種別は横に並べる。50種あっても1画面ほどに収まり、下へのスクロールが減る */}
      {mode === "item" && grouped.filter((g) => !isOpen(g)).length > 0 && (
        <div className="grid gap-1.5" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(225px, 1fr))" }}>
          {grouped.filter((g) => !isOpen(g)).map((g) => (
            <button key={g.cat} type="button" onClick={() => setOpenCat((o) => ({ ...o, [g.cat]: true }))}
              className="text-left bg-white border border-slate-200 rounded px-2 py-1.5 hover:bg-cyan-50 hover:border-cyan-300">
              <div className="text-sm font-semibold text-slate-700 truncate" title={g.cat}>▶ {g.cat}</div>
              <div className="text-xs text-slate-500">{g.items.length}品目 ／ 記録 {g.n}行</div>
            </button>
          ))}
        </div>
      )}

      {mode === "flat" && (
        <Card title={"🧾 取り込んだ記録（新しい順） " + flat.length.toLocaleString() + "行"}>
          <div className="overflow-x-auto"><table className="tbl text-sm w-full whitespace-nowrap">
            <thead><tr><th>仕入日</th><th>仕入先</th><th>種別</th><th>メーカ</th><th>型番</th><th>品名</th><th>数量</th><th>単位</th><th>単価</th><th>金額</th><th>現場</th><th>取込・出典</th></tr></thead>
            <tbody>{flat.slice(0, FLIM).map((h, i) => (
              <tr key={i} className="hover:bg-cyan-50">
                <td>{ymd(h.date)}</td><td className="max-w-[9rem] truncate" title={h.vendor}>{h.vendor}</td>
                <td className="max-w-[10rem] truncate">{catOf[shiireKey(h)] || ""}</td>
                <td>{h.maker}</td><td className="font-mono">{h.model}</td>
                <td className="max-w-[20rem] truncate" title={h.name}>{h.name}</td>
                <td className="text-right">{h.qty}</td><td className="text-center">{h.unit}</td>
                <td className="text-right font-semibold">{yen(h.price)}</td><td className="text-right text-slate-500">{yen(h.amt)}</td>
                <td className="max-w-[10rem] truncate" title={h.site}>{h.site}</td>
                <td className="text-xs text-slate-500 max-w-[16rem] truncate" title={(h.imported || "") + " " + (h.src || "")}>{h.imported ? h.imported + " " : ""}{h.src}</td>
              </tr>
            ))}</tbody>
          </table></div>
          {flat.length > FLIM && <div className="text-xs text-slate-400 mt-1">他 {(flat.length - FLIM).toLocaleString()} 行（しぼり込むか「CSVに出す」で全部見られます）</div>}
        </Card>
      )}
      <div className="text-xs text-slate-400">※ 単価は取り込んだ見積・請求に書いてあったそのままの値です。日付が古い物は相場が動いている可能性があるので、使う前に仕入先へ確かめてください。</div>
    </div>
  );
}

// ================= アプリ本体 =================
function App() {
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("search");
  const [q, setQ] = useState("");
  const [netQ, setNetQ] = useState(""); const [netEdited, setNetEdited] = useState(false);
  const [sekisan, setSekisan] = useState({ ok: false, master: [], reason: "読込中…" });
  const [zairyo, setZairyoRaw] = useState({ items: [], history: [], importedAt: "", fileName: "" });
  const setZairyo = useCallback((z) => setZairyoRaw((prev) => zairyoWithSrc(typeof z === "function" ? z(prev) : z)), []);
  const [cases, setCases] = useState([]);
  const [cur, setCur] = useState(() => blankCase());
  const [settings, setSettings] = useState(() => ({ ...DEFAULT_SETTINGS }));
  const [bulkState, setBulkState] = useState({ text: "", rows: [], srcInfo: "" }); // まとめて検索の作業内容（タブ移動で消えないよう App が保持）
  const declinedRef = useRef({});                // 取り込まないと決めた行の覚え（マスタ更新の確認で使う）
  const [docs, setDocs] = useState({});          // 品目キー→資料リンク配列（カタログ/仕様書/姿図）
  const [market, setMarket] = useState({});      // ネット価格DB：品目キー→{model,name,maker,unit,adoptedId,entries[]}
  const [priceItem, setPriceItem] = useState(null); // {item, onAdopt}
  // --- マスタの自動追随（材料マスタ.xlsx の監視／マスタ配信ファイル） ---
  const zairyoHandleRef = useRef(null);
  const [zWatch, setZWatch] = useState({ name: "", ready: false, checkedAt: 0 });
  const mpackHandleRef = useRef(null);
  const [mpack, setMpack] = useState({ name: "", ready: false, lastWrite: 0 });
  const [updateNotice, setUpdateNotice] = useState(null); // マスタを更新したときの通知
  const [pendingUpdates, setPendingUpdates] = useState([]); // 取り込み待ちのマスタ更新（起動時・手動確認で積む）
  const [docsItem, setDocsItem] = useState(null);
  const [histItem, setHistItem] = useState(null);
  const [preview, setPreview] = useState(false);
  const [savedMsg, setSavedMsg] = useState("");
  const [addFlash, setAddFlash] = useState("");
  const [saveState, setSaveState] = useState("");
  // --- バックアップ関連（見積ソフトと同方式） ---
  const fsSupported = (typeof window !== "undefined" && typeof window.showSaveFilePicker === "function");
  const fsHandleRef = useRef(null); const fsWritingRef = useRef(false);
  const [fsName, setFsName] = useState("");
  const [fsReady, setFsReady] = useState(false);
  const [fsLastWrite, setFsLastWrite] = useState(() => parseInt(localStorage.getItem("kakaku_fs_last_write") || "0", 10) || 0);
  const [lastBackup, setLastBackup] = useState(() => parseInt(localStorage.getItem("kakaku_last_backup") || "0", 10) || 0);
  const [autoRestored, setAutoRestored] = useState(null);   // 起動時にファイルから自動復元した通知
  const [permWarn, setPermWarn] = useState(false);          // 自動保存の権限切れ警告
  const [recoveryNotice, setRecoveryNotice] = useState(null); // 世代から案件を復旧した通知
  const [gens, setGens] = useState([]);                     // 世代一覧（表示用: at/ts/count）
  const lastGenRef = useRef({ count: 0 });
  const latestRef = useRef({}); latestRef.current = { cases, cur, settings, zairyo, docs, market, sekisan };

  // ---- 起動読込 ----
  // 承認済みの見積マスタ（このアプリが実際に使うマスタ。取り込みOKを出した時点の内容）
  const readApprovedSekisan = async () => {
    try { const sn = await window.storage.get(KEY_SEKISAN_SNAP); if (sn && sn.value) { const d = JSON.parse(sn.value); if (d && d.master && d.master.length) return d; } } catch (e) {}
    return null;
  };
  const saveApprovedSekisan = async (master, ts) => {
    const at = new Date().toLocaleString("ja-JP");
    await window.storage.set(KEY_SEKISAN_SNAP, JSON.stringify({ master, ts: ts || 0, at }));
    return at;
  };
  // 見積ソフトのマスタに更新があるか調べる（取り込みはしない）。差分があれば確認用の項目を返す
  const buildSekisanPending = async (curMaster) => {
    const live = await window.readSekisanMaster();
    if (!live.ok) return null;
    const d = dropDeclined(diffMasterLists(curMaster || [], live.master, sekisanKey, sekisanPrice, sekisanLabel), declinedRef.current.sekisan);
    if (!hasMasterDiff(d)) return null;
    return { id: "sekisan", kind: "sekisan", title: "見積ソフトのマスタ（仕入単価）", sub: "見積ソフトの最終保存：" + (live.ts ? new Date(live.ts).toLocaleString("ja-JP") : "—"), diff: d, payload: { master: live.master, ts: live.ts } };
  };
  const loadSekisan = useCallback(async () => {
    // 手動の「更新を確認」。差分があれば確認モーダルを出す（勝手には切り替えない）
    const cur = latestRef.current.sekisan || {};
    const live = await window.readSekisanMaster();
    if (!live.ok) { alert("見積ソフトのデータを読めません：" + live.reason); return live; }
    const p = await buildSekisanPending(cur.master || []);
    if (!p) { alert("見積ソフトのマスタに更新はありません（" + live.master.length.toLocaleString() + " 件）。"); return live; }
    setPendingUpdates((ps) => [...ps.filter((x) => x.id !== "sekisan"), p]);
    return live;
  }, []);
  useEffect(() => {
    (async () => {
      try {
        // 永続ストレージを要求（ブラウザ都合のサイトデータ退避を抑止）
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
        const m = await window.storage.get(KEY_MAIN);
        let mainD = null;
        if (m && m.value) { try { mainD = JSON.parse(m.value); } catch (e) {} }
        const curTs = (mainD && mainD.ts) || 0;
        // ★データ金庫からの復旧（2026-09-12・許可不要）：ブラウザ側が空 or 金庫の方が新しいときだけ戻す
        try {
          if (window.Vault && String(location.protocol).indexOf("http") === 0) {
            const g = await window.Vault.load("価格調査_全データ.json", { app: "kakaku" });
            if (g && g.ok && g.text) {
              const d = JSON.parse(g.text);
              if (d && d.app === "kakaku_chousa_full" && d.main && !payloadEmpty(d) && ((d.ts || 0) > curTs || curTs === 0)) {
                await applyBackupObj(d);
                mainD = { version: 1, ...d.main, ts: d.ts || Date.now() };
                if (d.zairyo && d.zairyo.items) setZairyo(d.zairyo);
                if (d.docs) setDocs(d.docs);
                if (d.market) setMarket(d.market);
                setAutoRestored({ savedAt: (d.savedAt || "") + "（データ金庫）" });
              }
            }
          }
        } catch (e) {}
        // === 自動保存ファイル(FSA)からの起動時自動復元：IDBが飛んでも自己回復。ファイルが新しい/現データ消失時のみ＝新しいローカル編集を誤って戻さない ===
        if (fsSupported) {
          try {
            const h = await idbHandleGet();
            if (h) {
              fsHandleRef.current = h;
              setFsName(h.name || "自動保存.json");
              let p = "prompt"; try { p = await h.queryPermission({ mode: "readwrite" }); } catch (e) {}
              if (p === "granted") {
                setFsReady(true);
                try {
                  const d = JSON.parse(await (await h.getFile()).text());
                  if (d && d.app === "kakaku_chousa_full" && d.main && !payloadEmpty(d) && ((d.ts || 0) > curTs || curTs === 0)) {
                    mainD = { version: 1, ...d.main, ts: d.ts || Date.now() };
                    await window.storage.set(KEY_MAIN, JSON.stringify(mainD));
                    if (d.zairyo && d.zairyo.items) { await window.storage.set(KEY_ZAIRYO, JSON.stringify(d.zairyo)); setZairyo(d.zairyo); }
                    if (d.docs) { await window.storage.set(KEY_DOCS, JSON.stringify(d.docs)); setDocs(d.docs); }
                    if (d.market) { await window.storage.set(KEY_MARKET, JSON.stringify(d.market)); setMarket(d.market); }
                    if (d.sekisanSnap && d.sekisanSnap.master && d.sekisanSnap.master.length) { await window.storage.set(KEY_SEKISAN_SNAP, JSON.stringify(d.sekisanSnap)); }
                    setAutoRestored({ savedAt: d.savedAt || "" });
                  }
                } catch (e) {}
              } else { setPermWarn(true); } // 権限が無く自動で読めない→バナーでワンクリック再有効化
            }
          } catch (e) {}
        }
        let loadedCases = [];
        if (mainD) {
          if (mainD.cases) loadedCases = mainD.cases;
          if (mainD.cur) setCur({ ...blankCase(), ...mainD.cur, dest: { ...blankCase().dest, ...(mainD.cur.dest || {}) } });
          if (mainD.settings) setSettings((s) => ({ ...DEFAULT_SETTINGS, ...mainD.settings, company: { ...DEFAULT_SETTINGS.company, ...(mainD.settings.company || {}) }, links: (mainD.settings.links && mainD.settings.links.length) ? mainD.settings.links : DEFAULT_LINKS, urlPatterns: (mainD.settings.urlPatterns && mainD.settings.urlPatterns.length) ? mainD.settings.urlPatterns : DEFAULT_URL_PATTERNS }));
        } else {
          // 初回：見積ソフトの会社情報をプレフィル（localStorageは file:// で共有）
          try {
            const co = JSON.parse(localStorage.getItem("sakae_company_info") || "{}");
            if (co && (co.name || co.address)) setSettings((s) => ({ ...s, company: { ...s.company, name: co.name || "", address: co.address || "", tel: co.phone || "", invoice: co.invoice || "", rep: co.rep || "" } }));
          } catch (e) {}
        }
        // === 世代バックアップからの自己修復マージ：liveに無い(=失われた)案件だけ復元。意図的に削除したもの(墓石)は除外 ===
        let gensArr = [];
        try { const bkR = await window.storage.get(KEY_GENS); gensArr = JSON.parse((bkR && bkR.value) || "[]"); if (!Array.isArray(gensArr)) gensArr = []; } catch (e) { gensArr = []; }
        setGens(gensArr.map((g) => ({ at: g.at, ts: g.ts, count: g.count })));
        const del = readDeleted();
        const byId = new Map();
        loadedCases.forEach((x) => { if (x && x.id) byId.set(x.id, x); });
        let recovered = 0;
        gensArr.forEach((g) => (g && g.list ? g.list : []).forEach((x) => {
          if (!x || !x.id) return;
          const xts = caseTs(x);
          if (del[x.id] != null && del[x.id] >= xts) return; // 削除済み(墓石が版より新しい)は復元しない
          const pr = byId.get(x.id);
          if (!pr) { byId.set(x.id, x); recovered++; }              // 失った案件を復元
          else if (xts > caseTs(pr)) { byId.set(x.id, x); }         // より新しい版があれば更新
        }));
        const merged = [...byId.values()].filter((x) => !(del[x.id] != null && del[x.id] >= caseTs(x))).sort((a, b) => caseTs(b) - caseTs(a));
        setCases(merged);
        lastGenRef.current = { count: merged.length };
        if (recovered > 0) setRecoveryNotice({ recovered });
        let zairyoData = null;
        const z = await window.storage.get(KEY_ZAIRYO);
        if (z && z.value) { try { const d = JSON.parse(z.value); if (d && d.items) { zairyoData = d; setZairyo(d); } } catch (e) {} }
        const dk = await window.storage.get(KEY_DOCS);
        if (dk && dk.value) { try { const d = JSON.parse(dk.value); if (d && typeof d === "object") setDocs(d); } catch (e) {} }
        const mk = await window.storage.get(KEY_MARKET);
        if (mk && mk.value) { try { const d = JSON.parse(mk.value); if (d && typeof d === "object") setMarket(d); } catch (e) {} }
        const dc = await window.storage.get(KEY_DECLINE);   // 「取り込まない」と決めた行の覚え
        if (dc && dc.value) { try { const d = JSON.parse(dc.value); if (d && typeof d === "object") declinedRef.current = d; } catch (e) {} }
        // 材料マスタ.xlsx の紐づけ／マスタ配信ファイルのハンドルを復元（権限は後で確認）
        try {
          const zh = await idbRawGet(ZAIRYO_HANDLE_KEY);
          if (zh) { zairyoHandleRef.current = zh; let p = "prompt"; try { p = await zh.queryPermission({ mode: "read" }); } catch (e) {} setZWatch({ name: zh.name || "材料マスタ.xlsx", ready: p === "granted", checkedAt: 0 }); }
          const mh = await idbRawGet(MPACK_HANDLE_KEY);
          if (mh) { mpackHandleRef.current = mh; let p2 = "prompt"; try { p2 = await mh.queryPermission({ mode: "readwrite" }); } catch (e) {} setMpack({ name: mh.name || "", ready: p2 === "granted", lastWrite: parseInt(localStorage.getItem("kakaku_mpack_last") || "0", 10) || 0 }); }
        } catch (e) {}
        // === マスタの更新確認は「アプリを開いたとき」だけ。作業中に勝手に切り替えない ===
        const pend = [];
        // 見積ソフトのマスタ：承認済みの内容を使い、新しいものがあれば確認モーダルに回す
        const approved = await readApprovedSekisan();
        const live = await window.readSekisanMaster();
        if (live.ok) {
          if (!approved) { // 初回だけは確認なしで採用（比べる相手が無いため）
            const at = await saveApprovedSekisan(live.master, live.ts);
            setSekisan({ ok: true, master: live.master, ts: live.ts, snap: false, at });
          } else {
            setSekisan({ ok: true, master: approved.master, ts: approved.ts, snap: false, at: approved.at || "" });
            const d = dropDeclined(diffMasterLists(approved.master, live.master, sekisanKey, sekisanPrice, sekisanLabel), declinedRef.current.sekisan);
            if (hasMasterDiff(d)) pend.push({ id: "sekisan", kind: "sekisan", title: "見積ソフトのマスタ（仕入単価）", sub: "見積ソフトの最終保存：" + (live.ts ? new Date(live.ts).toLocaleString("ja-JP") : "—"), diff: d, payload: { master: live.master, ts: live.ts } });
          }
        } else if (approved) {
          setSekisan({ ok: true, master: approved.master, ts: approved.ts, snap: true, at: approved.at || "" });
        } else {
          setSekisan({ ok: false, master: [], reason: live.reason });
        }
        // 材料マスタ.xlsx：紐づけ済みならファイルの更新を確認（取り込みは承認後）
        try {
          const zh2 = zairyoHandleRef.current;
          if (zh2) {
            let pm = "prompt"; try { pm = await zh2.queryPermission({ mode: "read" }); } catch (e) {}
            if (pm === "granted") {
              const f = await zh2.getFile();
              if ((f.lastModified || 0) !== ((zairyoData && zairyoData.lastMod) || 0)) {
                const nd = parseZairyoXlsx(await f.arrayBuffer(), f.name); nd.lastMod = f.lastModified || 0;
                const d2 = dropDeclined(diffMasterLists((zairyoData && zairyoData.items) || [], nd.items, zairyoKey, (x) => x.price, zairyoLabel), declinedRef.current.zairyo);
                if (hasMasterDiff(d2)) pend.push({ id: "zairyo", kind: "zairyo", title: "材料マスタ.xlsx（仕入実績）", sub: "ファイルの更新：" + new Date(f.lastModified || 0).toLocaleString("ja-JP"), diff: d2, payload: nd });
                else { await window.storage.set(KEY_ZAIRYO, JSON.stringify(nd)); setZairyo(nd); } // 中身が同じなら黙って日時だけ合わせる
              }
              setZWatch((w) => ({ ...w, ready: true, checkedAt: Date.now() }));
            }
          }
        } catch (e) {}
        if (pend.length) setPendingUpdates(pend);
      } finally { setLoaded(true); }
    })();
  }, []);

  // ---- 自動保存（600msデバウンス） ----
  useEffect(() => {
    if (!loaded) return;
    setSaveState("…");
    const t = setTimeout(async () => {
      try { await window.storage.set(KEY_MAIN, JSON.stringify({ version: 1, cases, cur, settings, ts: Date.now() })); setSaveState("保存済 " + new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })); }
      catch (e) { setSaveState("保存失敗"); }
      vaultWrite("auto");   // ★データ金庫にも
    }, 600);
    return () => clearTimeout(t);
  }, [cases, cur, settings, loaded]);

  // 資料リンクの永続化（案件データとは別キー。バックアップには同梱される）
  useEffect(() => { if (!loaded) return; window.storage.set(KEY_DOCS, JSON.stringify(docs)).catch(() => {}); vaultWrite("docs"); }, [docs, loaded]);
  const saveDocs = (key, list) => setDocs((prev) => { const n = { ...prev }; if (!list || !list.length) delete n[key]; else n[key] = list; return n; });
  // ネット価格DBの永続化
  useEffect(() => { if (!loaded) return; window.storage.set(KEY_MARKET, JSON.stringify(market)).catch(() => {}); }, [market, loaded]);
  const saveMarket = (key, rec) => setMarket((prev) => { const n = { ...prev }; if (!rec) delete n[key]; else n[key] = rec; return n; });
  const showPrice = (item, onAdopt) => setPriceItem({ item, onAdopt: onAdopt || null });

  // ===== バックアップ（見積ソフトと同方式） =====
  // 全データのバックアップペイロード。手動DL・FSA自動保存・復元で共用
  const buildBackupPayload = () => { const L = latestRef.current; return { version: 1, app: "kakaku_chousa_full", savedAt: new Date().toLocaleString("ja-JP"), ts: Date.now(), main: { cases: L.cases, cur: L.cur, settings: L.settings }, zairyo: L.zairyo, docs: L.docs, market: L.market,
    sekisanSnap: (L.sekisan && L.sekisan.ok && L.sekisan.master && L.sekisan.master.length) ? { master: L.sekisan.master, ts: L.sekisan.ts || 0, at: L.sekisan.snap ? (L.sekisan.at || "") : new Date().toLocaleString("ja-JP") } : undefined }; };
  const applyBackupObj = async (d) => {
    await window.storage.set(KEY_MAIN, JSON.stringify({ version: 1, ...d.main, ts: d.ts || Date.now() }));
    if (d.zairyo) await window.storage.set(KEY_ZAIRYO, JSON.stringify(d.zairyo));
    if (d.docs) await window.storage.set(KEY_DOCS, JSON.stringify(d.docs));
    if (d.market) await window.storage.set(KEY_MARKET, JSON.stringify(d.market));
    if (d.sekisanSnap && d.sekisanSnap.master && d.sekisanSnap.master.length) await window.storage.set(KEY_SEKISAN_SNAP, JSON.stringify(d.sekisanSnap)); // スマホ等で見積マスタを検索できるように
  };
  // ★データ金庫（2026-09-12）：ドライブのファイルへ直接書く。許可クリック不要なので止まらない。

  // FSA自動保存：データ変更のたび設定済みファイルへ書き出し。失敗（権限失効等）は停止して再有効化を促す＝無限リトライしない

  // ---- 材料マスタ取込 ----

  // 材料マスタ.xlsx を紐づけ（以後は更新日時を見て自動で取り込む）

  // 確認モーダルで承認された更新を実際に取り込む。picks があれば選ばれた行だけ入れる（2026-09-18）
  const applyPending = async (ids, picks) => {

      rows: [...c.rows, { ...blankRow(mk), ...src, qty: 1, markup: mk, bid: cost ? Math.round(cost * mk) : "", bidManual: false }]
    }));
    flash("「" + (src.model || src.name || "").slice(0, 20) + "」を案件に追加しました（案件タブへ）", setAddFlash);
  };
  // まとめて検索から複数行を一度に案件へ追加
  const addRowsBulk = (items) => {
    if (!items || !items.length) return;
    const mk = num(settings.defaultMarkup) || 1.3;
    setCur((c) => ({
      ...c, updatedAt: new Date().toISOString(),
      rows: [...c.rows, ...items.map((src) => { const cost = num(src.cost); return { ...blankRow(mk), ...src, qty: num(src.qty) || 1, markup: mk, bid: cost ? Math.round(cost * mk) : "", bidManual: false }; })],
    }));
    flash(items.length + "件を案件に追加しました（案件タブへ）", setAddFlash);
  };
  const saveCase = () => {
    const nm = (cur.name || "").trim();
    if (!nm) { alert("案件名を入力してください（案件タブの上部）"); setTab("case"); return; }
    const now = new Date().toISOString();
    setCases((cs) => {
      const dup = cs.find((c) => c.id !== cur.id && (c.name || "").trim() === nm);
      let list = cs;
      if (dup) {
        if (confirm("同名の案件「" + nm + "」があります。上書き保存しますか？\n［OK＝上書き／キャンセル＝別IDで追加保存］")) { list = cs.filter((c) => c.id !== dup.id); markDeleted(dup.id); }
      }
      const entry = { ...cur, name: nm, updatedAt: now, ts: Date.now() };
      const i = list.findIndex((c) => c.id === cur.id);
      return i >= 0 ? list.map((c) => (c.id === cur.id ? entry : c)) : [entry, ...list];
    });
    flash("保存しました", setSavedMsg);
  };
  const newCase = () => {
    if (caseHasContent(cur)) {
      if (!confirm("現在の案件を保存してから新規を開始します。よろしいですか？\n（案件名が空の場合は「無題 日付」で保存されます）")) return;
      const nm = (cur.name || "").trim() || ("無題 " + today());
      const entry = { ...cur, name: nm, updatedAt: new Date().toISOString(), ts: Date.now() };
      setCases((cs) => { const i = cs.findIndex((c) => c.id === cur.id); return i >= 0 ? cs.map((c) => (c.id === cur.id ? entry : c)) : [entry, ...cs]; });
    }
    setCur(blankCase()); setTab("case");
  };
  const openCase = (c) => {
    if (caseHasContent(cur) && cur.id !== c.id && !cases.some((x) => x.id === cur.id)) {
      if (!confirm("現在の未保存の案件は破棄されます。「" + (c.name || "無題") + "」を開きますか？")) return;
    }
    setCur(JSON.parse(JSON.stringify({ ...blankCase(), ...c, dest: { ...blankCase().dest, ...(c.dest || {}) } })));
    setTab("case");
  };
  const dupCase = (c) => {
    const copy = JSON.parse(JSON.stringify(c));
    copy.id = uid(); copy.name = (c.name || "無題") + " (コピー)"; copy.updatedAt = new Date().toISOString(); copy.ts = Date.now();
    copy.rows = (copy.rows || []).map((r) => ({ ...r, id: uid() }));
    setCases((cs) => [copy, ...cs]);
  };
  const delCase = (id) => { markDeleted(id); setCases((cs) => cs.filter((c) => c.id !== id)); }; // 墓石を記録＝世代復旧で復活させない

  // ---- 出力 ----
  const exportMitsumori = () => {
    const rows = cur.rows.filter((r) => (r.name || "").trim() || (r.model || "").trim()).map((r) => ({
      rowId: uid(), masterId: null, name: [(r.name || "").trim(), (r.model || "").trim()].filter(Boolean).join(" "),
      unit: r.unit || "式", cat: r.catName || "", kind: "new", trade: "電工",
      qty: num(r.qty) || 1, std: 0, cost: num(r.cost) || 0, markup: num(r.markup) || 1.3, bid: rowBid(r) || 0,
      labor: 0, kamoku: "電気設備", costCat: "", costAmt: "", secCat: "",
    }));
    if (!rows.length) { alert("明細がありません"); return; }
    const payload = { version: 1, app: "minkan_mitsumori", savedAt: new Date().toLocaleString("ja-JP"), project: { ...MITSUMORI_PROJECT, name: (cur.name || "価格調査").trim(), note: cur.memo || "" }, rows };
    const nm = "見積連携_" + safeName(cur.name || "価格調査") + "_" + ymdStr() + ".json";
    downloadBlob(new Blob([JSON.stringify(payload, null, 1)], { type: "application/json" }), nm);
    alert("「" + nm + "」を書き出しました。\n見積ソフトの 一時保存メニュー「ファイルから読込」か、開始画面の個別取込で読み込んでください。");
  };
  const exportExcel = async () => {
    if (!cur.rows.some((r) => (r.name || "").trim() || (r.model || "").trim())) { alert("明細がありません"); return; }
    try { const nm = await exportRequestExcel(cur, settings, !!settings.priceOnSheet); flash("Excelを出力しました：" + nm, setSavedMsg); }
    catch (e) { alert("Excel出力に失敗しました：" + ((e && e.message) || e)); }
  };
  const doPrint = () => {
    document.body.classList.add("printing");
    const done = () => { document.body.classList.remove("printing"); window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done);
    setTimeout(() => window.print(), 50);
  };

  // ---- バックアップ ----
  const exportAll = async () => {
    try {
      const payload = buildBackupPayload();
      downloadBlob(new Blob([JSON.stringify(payload)], { type: "application/json" }), "価格調査_全データ_" + ymdStr() + ".json");
      const now = Date.now(); lsSet("kakaku_last_backup", String(now)); setLastBackup(now);
    } catch (e) { alert("バックアップに失敗しました：" + ((e && e.message) || e)); }
  };
  const importAll = (file) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const d = JSON.parse(e.target.result);
        if (!(d && d.app === "kakaku_chousa_full" && d.main)) { alert("価格調査ソフトのバックアップではありません"); return; }
        if (!confirm("現在のデータ（案件・設定・取込済み材料マスタ）を、このバックアップで全て置き換えます。よろしいですか？")) return;
        await applyBackupObj(d);
        alert("復元しました。画面を再読み込みします。");
        location.reload();
      } catch (err) { alert("復元に失敗しました：" + err); }
    };
    reader.readAsText(file);
  };

  const vendorList = useMemo(() => {
    const s = new Set();
    (zairyo.items || []).forEach((x) => { if (x.vendor) s.add(x.vendor); });
    (zairyo.history || []).forEach((x) => { if (x.vendor) s.add(x.vendor); });
    return Array.from(s).sort();
  }, [zairyo]);

  const TABS = [["search", "🔍 価格検索"], ["shiire", "🏪 仕入先情報"], ["bulk", "📦 まとめて検索"], ["case", "📋 案件・集計"], ["list", "🗂 案件一覧"], ["settings", "⚙ 設定"]];
  return (
    <div className="w-full px-3 py-2">
      <div className="flex items-center gap-3 mb-2 flex-wrap">
        <h1 className="text-xl font-bold text-cyan-900">💴 価格調査ソフト</h1>
        <span className="text-xs text-slate-400 app-sub">仕入価格・市場価格の検索と簡易集計</span>
        <span className="ml-auto text-xs text-slate-400">{saveState}</span>
        <DeployButton />
      </div>
      <div className="flex gap-1 mb-2 overflow-x-auto">
        {TABS.map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)}
            className={"px-3.5 py-1.5 rounded-t text-sm shrink-0 " + (tab === k ? "bg-cyan-700 text-white font-semibold" : "bg-white text-slate-600 hover:bg-slate-50 border border-b-0 border-slate-200")}>
            {label}{k === "case" && cur.rows.length ? <span className="ml-1 text-xs bg-white/25 rounded-full px-1.5">{cur.rows.length}</span> : null}
          </button>
        ))}
      </div>
      {addFlash && <div className="fixed top-3 right-3 z-50 bg-emerald-600 text-white text-sm rounded px-3 py-2 shadow-lg">{addFlash}</div>}
      {permWarn && (
        <div className="mb-3 bg-amber-50 border border-amber-300 text-amber-800 text-sm rounded px-3 py-2 flex items-center gap-2 flex-wrap">
          ⚠ 自動バックアップの権限が切れています{fsName ? "（" + fsName + "）" : ""}。自動保存は停止中です。
          <Btn variant="primary" onClick={enableAutoSave}>🔓 再有効化</Btn>
          <Btn variant="ghost" onClick={() => setPermWarn(false)}>✕</Btn>
        </div>
      )}
      {autoRestored && (
        <div className="mb-3 bg-emerald-50 border border-emerald-300 text-emerald-800 text-sm rounded px-3 py-2 flex items-center gap-2 flex-wrap">
          ✅ 自動保存ファイル{autoRestored.savedAt ? "（" + autoRestored.savedAt + " 保存分）" : ""}からデータを復元しました。
          <Btn variant="ghost" onClick={() => setAutoRestored(null)}>✕</Btn>
        </div>
      )}
      {updateNotice && (
        <div className="mb-3 bg-cyan-50 border border-cyan-300 text-cyan-900 text-sm rounded px-3 py-2 flex items-center gap-2 flex-wrap">
          🔄 {updateNotice.msg}<span className="text-xs text-slate-500">{updateNotice.at}</span>
          <Btn variant="ghost" onClick={() => setUpdateNotice(null)}>✕</Btn>
        </div>
      )}
      {recoveryNotice && (
        <div className="mb-3 bg-sky-50 border border-sky-300 text-sky-800 text-sm rounded px-3 py-2 flex items-center gap-2 flex-wrap">
          ♻ 世代バックアップから案件 {recoveryNotice.recovered} 件を復旧しました。
          <Btn variant="ghost" onClick={() => setRecoveryNotice(null)}>✕</Btn>
        </div>
      )}

      {tab === "search" && <SearchTab q={q} setQ={setQ} sekisan={sekisan} zairyo={zairyo} settings={settings} docs={docs} market={market}
        onAddRow={addRowFrom} onShowHist={setHistItem} onShowDocs={setDocsItem} onShowPrice={showPrice} netQ={netQ} setNetQ={setNetQ} netEdited={netEdited} setNetEdited={setNetEdited} />}
      {tab === "shiire" && <ShiireTab zairyo={zairyo} onShowHist={setHistItem} onAddRow={addRowFrom} />}
      {tab === "bulk" && <BulkTab sekisan={sekisan} zairyo={zairyo} settings={settings} docs={docs} market={market} state={bulkState} setState={setBulkState} onAddRows={addRowsBulk} onShowDocs={setDocsItem} onShowPrice={showPrice} />}
      {tab === "case" && <CaseTab cur={cur} setCur={setCur} settings={settings} setSettings={setSettings} vendorList={vendorList} docs={docs} market={market} onShowDocs={setDocsItem} onShowPrice={showPrice}
        onSaveCase={saveCase} onNewCase={newCase} onPreview={() => setPreview(true)} onExportExcel={exportExcel} onExportMitsumori={exportMitsumori} savedMsg={savedMsg} />}
      {tab === "list" && <ListTab cases={cases} onOpen={openCase} onDup={dupCase} onDel={delCase} />}
      {tab === "settings" && <SettingsTab settings={settings} setSettings={setSettings} sekisan={sekisan} zairyo={zairyo} docs={docs} market={market}
        onReloadSekisan={loadSekisan} onImportZairyo={importZairyo} onExportAll={exportAll} onImportAll={importAll}
        zWatch={zWatch} mpack={mpack} onSetupZairyoWatch={setupZairyoWatch} onCheckZairyo={checkZairyoUpdate}
        onSetupMpack={setupMasterPackTarget} onWriteMpack={() => writeMasterPack("manual")} onExportMpack={exportMasterPack} onImportMpack={importMasterPack}
        fs={{ supported: fsSupported, name: fsName, ready: fsReady, lastWrite: fsLastWrite }} lastBackup={lastBackup} gens={gens}
        onSetupFs={setupAutoSaveTarget} onEnableFs={enableAutoSave} onFsWriteNow={() => fsWrite("manual")}
        onRestoreHandle={restoreFromHandle} onRestorePicker={restoreFromPicker} onRecoverGens={recoverFromGens} />}

      {histItem && <HistModal item={histItem} history={zairyo.history} onClose={() => setHistItem(null)} />}
      {pendingUpdates.length > 0 && <MasterUpdateModal items={pendingUpdates} onApply={applyPending} onSkip={skipPending} />}
      {docsItem && <DocsModal item={docsItem} docs={docs} settings={settings} onSaveDocs={saveDocs} onClose={() => setDocsItem(null)} />}
      {priceItem && <PriceModal item={priceItem.item} market={market} settings={settings} onSave={saveMarket} onAdopt={priceItem.onAdopt} onClose={() => setPriceItem(null)} />}

      {preview && (
        <div className="print-backdrop fixed inset-0 bg-black/50 z-40 overflow-auto p-4" onClick={() => setPreview(false)}>
          <div className="print-host mx-auto" style={{ maxWidth: "210mm" }} onClick={(e) => e.stopPropagation()}>
            <div className="no-print flex gap-1.5 justify-end mb-2">
              <label className="text-sm text-white flex items-center gap-1.5 mr-auto">
                <input type="checkbox" checked={!!settings.priceOnSheet} onChange={(e) => setSettings((s) => ({ ...s, priceOnSheet: e.target.checked }))} />参考単価を載せる
              </label>
              <Btn variant="primary" onClick={doPrint}>🖨 印刷（PDF保存）</Btn>
              <Btn onClick={() => setPreview(false)}>閉じる</Btn>
            </div>
            <RequestSheet cur={cur} settings={settings} showPrice={!!settings.priceOnSheet} />
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // 公開版（https）ではPWAとして動作させる：ホーム画面追加・オフライン起動用のキャッシュ。file:// では何もしない（manifestもfile://では取得できずエラーになるため付けない）
  if (location.protocol !== "file:") { var mf = document.createElement("link"); mf.rel = "manifest"; mf.href = "manifest.webmanifest"; document.head.appendChild(mf); }
  if ((location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1") && "serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
</body>
</html>
