        setFsReady(true); setPermWarn(false);
        try { const payload = buildBackupPayload(); if (!payloadEmpty(payload)) { const w = await h.createWritable(); await w.write(JSON.stringify(payload)); await w.close(); const now = Date.now(); setFsLastWrite(now); lsSet("kakaku_fs_last_write", String(now)); } } catch (e) {}
      } else alert("書き込み権限が許可されませんでした。");
    } catch (e) { alert("有効化に失敗しました：" + ((e && e.message) || e)); }
  };
  const restoreFromHandle = async () => {
    const h = fsHandleRef.current; if (!h) { restoreFromPicker(); return; }

    try {
      const perm = await h.queryPermission({ mode: "read" });

      window.location.reload();
    } catch (e) { alert("復元に失敗しました：" + ((e && e.message) || e)); }
  };
  const restoreFromPicker = async () => {
    if (!fsSupported) { alert("このブラウザは非対応です。『バックアップから復元』でJSONを選んでください。"); return; }
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      if (!window.confirm("選んだファイルの内容で、現在のデータを全て置き換えます。よろしいですか？")) return;
      const d = JSON.parse(await (await h.getFile()).text());

  // FSA自動保存：データ変更後4秒デバウンスで書き出し（fsReady時のみ）
  useEffect(() => {

    return () => clearTimeout(t);
  }, [cases, cur, settings, zairyo, docs, market, fsReady, loaded]);
  // 自動ローリング世代バックアップ：案件一覧をIDB別キーへ日時付き最大10世代。件数が半減する変化は追記しない（誤消去の巻き戻し保護）
  useEffect(() => {
    if (!loaded || !cases.length) return;
    const t = setTimeout(async () => {
      try {
        const prevCount = lastGenRef.current.count;
        if (prevCount >= 4 && cases.length < prevCount / 2) return; // 半減は保護（古い世代を残す）
        const raw = await window.storage.get(KEY_GENS);
        let g = []; try { g = JSON.parse((raw && raw.value) || "[]"); if (!Array.isArray(g)) g = []; } catch (e) { g = []; }

        g = g.slice(0, 10);
        await window.storage.set(KEY_GENS, JSON.stringify(g));
        setGens(g.map((x) => ({ at: x.at, ts: x.ts, count: x.count })));
        lastGenRef.current = { count: cases.length };
      } catch (e) {}
    }, 4000);
    return () => clearTimeout(t);
  }, [cases, loaded]);
  // 世代から失われた案件を手動復旧（起動時マージと同じロジック）
  const recoverFromGens = async () => {
    try {
      const raw = await window.storage.get(KEY_GENS);
      let gensArr = []; try { gensArr = JSON.parse((raw && raw.value) || "[]"); if (!Array.isArray(gensArr)) gensArr = []; } catch (e) {}
      const del = readDeleted();
      const byId = new Map();
      cases.forEach((x) => { if (x && x.id) byId.set(x.id, x); });
      let recovered = 0;
      gensArr.forEach((g) => (g && g.list ? g.list : []).forEach((x) => {
        if (!x || !x.id) return;
        const xts = caseTs(x);
        if (del[x.id] != null && del[x.id] >= xts) return;
        const pr = byId.get(x.id);
        if (!pr) { byId.set(x.id, x); recovered++; }
        else if (xts > caseTs(pr)) { byId.set(x.id, x); }
      }));
      if (!recovered) { alert("世代バックアップに、現在の一覧に無い案件はありませんでした。"); return; }
      setCases([...byId.values()].sort((a, b) => caseTs(b) - caseTs(a)));
      alert("世代バックアップから " + recovered + " 件の案件を復旧しました。");
    } catch (e) { alert("復旧に失敗しました：" + ((e && e.message) || e)); }
  };

  // ---- 材料マスタ取込 ----
  // 材料マスタ.xlsx を取り込む（silent=自動更新時はアラートを出さずバナーで知らせる）
  const doImportZairyo = async (file, silent) => {
    const buf = await file.arrayBuffer();
    const d = parseZairyoXlsx(buf, file.name);
    d.lastMod = file.lastModified || 0;
    setZairyo(d);
    await window.storage.set(KEY_ZAIRYO, JSON.stringify(d));
    if (silent) setUpdateNotice({ msg: "材料マスタの更新を取り込みました（" + d.items.length + " 品目・履歴 " + d.history.length + " 行）", at: new Date().toLocaleString("ja-JP") });
    else alert("材料マスタを取り込みました：" + d.items.length + " 品目・履歴 " + d.history.length + " 行");
    return d;
  };
  const importZairyo = async (file) => { try { await doImportZairyo(file, false); } catch (e) { alert("取込に失敗しました：" + ((e && e.message) || e)); } };
  // 材料マスタ.xlsx を紐づけ（以後は更新日時を見て自動で取り込む）
  const setupZairyoWatch = async () => {
    if (typeof window.showOpenFilePicker !== "function") { alert("このブラウザはファイルの紐づけに非対応です（Chrome / Edge を推奨）。「材料マスタ.xlsxを取込」で都度取り込んでください。"); return; }
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: "Excel", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] } }] });
      zairyoHandleRef.current = h;
      await idbRawSet(ZAIRYO_HANDLE_KEY, h);

      await doImportZairyo(f, false);
      setZWatch({ name: h.name, ready: true, checkedAt: Date.now() });

    } catch (e) { if (e && e.name !== "AbortError") alert("紐づけに失敗しました：" + ((e && e.message) || e)); }

  // 紐づけたファイルの更新日時を見て、変わっていれば自動再取込
  const checkZairyoUpdate = useCallback(async (manual) => {
    const h = zairyoHandleRef.current;

    try {
      let p = "prompt"; try { p = await h.queryPermission({ mode: "read" }); } catch (e) {}
      if (p !== "granted" && manual) { try { p = await h.requestPermission({ mode: "read" }); } catch (e) {} }
      if (p !== "granted") { setZWatch((w) => ({ ...w, ready: false })); if (manual) alert("読み取りの許可が必要です。もう一度お試しください。"); return; }
      const f = await h.getFile();
      const cur = (latestRef.current.zairyo && latestRef.current.zairyo.lastMod) || 0;
      if ((f.lastModified || 0) !== cur) await doImportZairyo(f, true);
      setZWatch({ name: h.name, ready: true, checkedAt: Date.now() });
    } catch (e) { setZWatch((w) => ({ ...w, ready: false })); if (manual) alert("確認に失敗しました：" + ((e && e.message) || e)); }
  }, []);
  // ===== マスタ配信（スマホ・別PCへ渡す。案件やネット価格は含めない） =====
  const buildMasterPack = () => {
    const L = latestRef.current;
    const sk = L.sekisan;
    return { version: 1, app: "kakaku_master_pack", savedAt: new Date().toLocaleString("ja-JP"), ts: Date.now(),
      zairyo: L.zairyo && L.zairyo.items && L.zairyo.items.length ? L.zairyo : undefined,
      sekisanSnap: (sk && sk.ok && sk.master && sk.master.length) ? { master: sk.master, ts: sk.ts || 0, at: sk.snap ? (sk.at || "") : new Date().toLocaleString("ja-JP") } : undefined };
  };
  const masterPackEmpty = (p) => !((p.zairyo && p.zairyo.items && p.zairyo.items.length) || (p.sekisanSnap && p.sekisanSnap.master && p.sekisanSnap.master.length));
  const exportMasterPack = () => {
    const p = buildMasterPack();
    if (masterPackEmpty(p)) { alert("配信できるマスタがありません（材料マスタの取込、または見積ソフトの読込が必要です）。"); return; }
    downloadBlob(new Blob([JSON.stringify(p)], { type: "application/json" }), "価格調査_マスタ_" + ymdStr() + ".json");
  };
  const writeMasterPack = async (reason) => {
    const h = mpackHandleRef.current; if (!h) return;

      const p = buildMasterPack();

      const w = await h.createWritable(); await w.write(JSON.stringify(p)); await w.close();

    } catch (e) { setMpack((m) => ({ ...m, ready: false })); if (reason === "manual") alert("マスタ配信ファイルの書き出しに失敗しました：" + ((e && e.message) || e)); }
  };
  const setupMasterPackTarget = async () => {
    if (typeof window.showSaveFilePicker !== "function") { alert("このブラウザは非対応です。「マスタを書き出し」でファイルを保存してください。"); return; }
    try {
      const h = await window.showSaveFilePicker({ suggestedName: "価格調査_マスタ配信.json", types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      mpackHandleRef.current = h; await idbRawSet(MPACK_HANDLE_KEY, h);
      setMpack({ name: h.name, ready: true, lastWrite: 0 });
      await writeMasterPack("manual");
      alert("マスタ配信ファイルを設定しました。マスタが変わるたびに、このファイルへ自動で書き出します。\n※Googleドライブ内に置けば、スマホの「マスタだけ更新」から読み込めます。");
    } catch (e) { if (e && e.name !== "AbortError") alert("設定に失敗しました：" + ((e && e.message) || e)); }
  };
  // マスタだけを更新（案件・ネット価格・設定は保持）。全データバックアップからマスタ部分だけ取り出すことも可
  const importMasterPack = (file) => {

  // 見積ソフトのマスタ（仕入）を自動追随：画面に戻ったとき＋10分ごとに読み直し、変化があれば知らせる
  useEffect(() => {

      try {

  // ---- 案件操作 ----
  const flash = (msg, set) => { set(msg); setTimeout(() => set(""), 2000); };
  const addRowFrom = (src) => {
    const mk = num(settings.defaultMarkup) || 1.3;
    const cost = num(src.cost);
    setCur((c) => ({
      ...c, updatedAt: new Date().toISOString(),
      rows: [...c.rows, { ...blankRow(mk), ...src, qty: 1, markup: mk, bid: cost ? Math.round(cost * mk) : "", bidManual: false }]
    }));
    flash("「" + (src.model || src.name || "").slice(0, 20) + "」を案件に追加しました（案件タブへ）", setAddFlash);
  };
  // まとめて検索から複数行を一度に案件へ追加
  const addRowsBulk = (items) => {
    if (!items || !items.length) return;
    const mk = num(settings.defaultMarkup) || 1.3;
    setCur((c) => ({
      ...c, updatedAt: new Date().toISOString(),
      rows: [...c.rows, ...items.map((src) => { const cost = num(src.cost); return { ...blankRow(mk), ...src, qty: num(src.qty) || 1, markup: mk, bid: cost ? Math.round(cost * mk) : "", bidManual: false }; })],
    }));
    flash(items.length + "件を案件に追加しました（案件タブへ）", setAddFlash);
  };
  const saveCase = () => {
    const nm = (cur.name || "").trim();
    if (!nm) { alert("案件名を入力してください（案件タブの上部）"); setTab("case"); return; }
    const now = new Date().toISOString();
    setCases((cs) => {
      const dup = cs.find((c) => c.id !== cur.id && (c.name || "").trim() === nm);
      let list = cs;
      if (dup) {
        if (confirm("同名の案件「" + nm + "」があります。上書き保存しますか？\n［OK＝上書き／キャンセル＝別IDで追加保存］")) { list = cs.filter((c) => c.id !== dup.id); markDeleted(dup.id); }
      }
      const entry = { ...cur, name: nm, updatedAt: now, ts: Date.now() };
      const i = list.findIndex((c) => c.id === cur.id);
      return i >= 0 ? list.map((c) => (c.id === cur.id ? entry : c)) : [entry, ...list];
    });
    flash("保存しました", setSavedMsg);
  };
  const newCase = () => {
    if (caseHasContent(cur)) {
      if (!confirm("現在の案件を保存してから新規を開始します。よろしいですか？\n（案件名が空の場合は「無題 日付」で保存されます）")) return;
      const nm = (cur.name || "").trim() || ("無題 " + today());
      const entry = { ...cur, name: nm, updatedAt: new Date().toISOString(), ts: Date.now() };
      setCases((cs) => { const i = cs.findIndex((c) => c.id === cur.id); return i >= 0 ? cs.map((c) => (c.id === cur.id ? entry : c)) : [entry, ...cs]; });
    }
    setCur(blankCase()); setTab("case");
  };
  const openCase = (c) => {
    if (caseHasContent(cur) && cur.id !== c.id && !cases.some((x) => x.id === cur.id)) {
      if (!confirm("現在の未保存の案件は破棄されます。「" + (c.name || "無題") + "」を開きますか？")) return;
    }
    setCur(JSON.parse(JSON.stringify({ ...blankCase(), ...c, dest: { ...blankCase().dest, ...(c.dest || {}) } })));
    setTab("case");
  };
  const dupCase = (c) => {
    const copy = JSON.parse(JSON.stringify(c));
    copy.id = uid(); copy.name = (c.name || "無題") + " (コピー)"; copy.updatedAt = new Date().toISOString(); copy.ts = Date.now();
    copy.rows = (copy.rows || []).map((r) => ({ ...r, id: uid() }));
    setCases((cs) => [copy, ...cs]);
  };
  const delCase = (id) => { markDeleted(id); setCases((cs) => cs.filter((c) => c.id !== id)); }; // 墓石を記録＝世代復旧で復活させない

  // ---- 出力 ----
  const exportMitsumori = () => {
    const rows = cur.rows.filter((r) => (r.name || "").trim() || (r.model || "").trim()).map((r) => ({
      rowId: uid(), masterId: null, name: [(r.name || "").trim(), (r.model || "").trim()].filter(Boolean).join(" "),
      unit: r.unit || "式", cat: r.catName || "", kind: "new", trade: "電工",
      qty: num(r.qty) || 1, std: 0, cost: num(r.cost) || 0, markup: num(r.markup) || 1.3, bid: rowBid(r) || 0,
      labor: 0, kamoku: "電気設備", costCat: "", costAmt: "", secCat: "",
    }));
    if (!rows.length) { alert("明細がありません"); return; }
    const payload = { version: 1, app: "minkan_mitsumori", savedAt: new Date().toLocaleString("ja-JP"), project: { ...MITSUMORI_PROJECT, name: (cur.name || "価格調査").trim(), note: cur.memo || "" }, rows };
    const nm = "見積連携_" + safeName(cur.name || "価格調査") + "_" + ymdStr() + ".json";
    downloadBlob(new Blob([JSON.stringify(payload, null, 1)], { type: "application/json" }), nm);
    alert("「" + nm + "」を書き出しました。\n見積ソフトの 一時保存メニュー「ファイルから読込」か、開始画面の個別取込で読み込んでください。");
  };
  const exportExcel = async () => {
    if (!cur.rows.some((r) => (r.name || "").trim() || (r.model || "").trim())) { alert("明細がありません"); return; }
    try { const nm = await exportRequestExcel(cur, settings, !!settings.priceOnSheet); flash("Excelを出力しました：" + nm, setSavedMsg); }
    catch (e) { alert("Excel出力に失敗しました：" + ((e && e.message) || e)); }
  };
  const doPrint = () => {
    document.body.classList.add("printing");
    const done = () => { document.body.classList.remove("printing"); window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done);
    setTimeout(() => window.print(), 50);
  };

  // ---- バックアップ ----
  const exportAll = async () => {
    try {
      const payload = buildBackupPayload();
      downloadBlob(new Blob([JSON.stringify(payload)], { type: "application/json" }), "価格調査_全データ_" + ymdStr() + ".json");
      const now = Date.now(); lsSet("kakaku_last_backup", String(now)); setLastBackup(now);
    } catch (e) { alert("バックアップに失敗しました：" + ((e && e.message) || e)); }
  };
  const importAll = (file) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const d = JSON.parse(e.target.result);
        if (!(d && d.app === "kakaku_chousa_full" && d.main)) { alert("価格調査ソフトのバックアップではありません"); return; }
        if (!confirm("現在のデータ（案件・設定・取込済み材料マスタ）を、このバックアップで全て置き換えます。よろしいですか？")) return;
        await applyBackupObj(d);
        alert("復元しました。画面を再読み込みします。");
        location.reload();
      } catch (err) { alert("復元に失敗しました：" + err); }
    };
    reader.readAsText(file);
  };

  const vendorList = useMemo(() => {
    const s = new Set();
    (zairyo.items || []).forEach((x) => { if (x.vendor) s.add(x.vendor); });
    (zairyo.history || []).forEach((x) => { if (x.vendor) s.add(x.vendor); });
    return Array.from(s).sort();
  }, [zairyo]);

  const TABS = [["search", "🔍 価格検索"], ["bulk", "📦 まとめて検索"], ["case", "📋 案件・集計"], ["list", "🗂 案件一覧"], ["settings", "⚙ 設定"]];
  return (
    <div className="max-w-[1200px] mx-auto p-3">
      <div className="flex items-center gap-3 mb-3 flex-wrap">
        <h1 className="text-xl font-bold text-cyan-900">💴 価格調査ソフト</h1>
        <span className="text-xs text-slate-400 app-sub">仕入価格・市場価格の検索と簡易集計</span>
        <span className="ml-auto text-xs text-slate-400">{saveState}</span>
      </div>
      <div className="flex gap-1 mb-3 overflow-x-auto">
        {TABS.map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)}
            className={"px-3.5 py-1.5 rounded-t text-sm shrink-0 " + (tab === k ? "bg-cyan-700 text-white font-semibold" : "bg-white text-slate-600 hover:bg-slate-50 border border-b-0 border-slate-200")}>
            {label}{k === "case" && cur.rows.length ? <span className="ml-1 text-xs bg-white/25 rounded-full px-1.5">{cur.rows.length}</span> : null}
          </button>
        ))}
      </div>
      {addFlash && <div className="fixed top-3 right-3 z-50 bg-emerald-600 text-white text-sm rounded px-3 py-2 shadow-lg">{addFlash}</div>}
      {permWarn && (
        <div className="mb-3 bg-amber-50 border border-amber-300 text-amber-800 text-sm rounded px-3 py-2 flex items-center gap-2 flex-wrap">
          ⚠ 自動バックアップの権限が切れています{fsName ? "（" + fsName + "）" : ""}。自動保存は停止中です。
          <Btn variant="primary" onClick={enableAutoSave}>🔓 再有効化</Btn>
          <Btn variant="ghost" onClick={() => setPermWarn(false)}>✕</Btn>
        </div>
      )}
      {autoRestored && (
        <div className="mb-3 bg-emerald-50 border border-emerald-300 text-emerald-800 text-sm rounded px-3 py-2 flex items-center gap-2 flex-wrap">
          ✅ 自動保存ファイル{autoRestored.savedAt ? "（" + autoRestored.savedAt + " 保存分）" : ""}からデータを復元しました。
          <Btn variant="ghost" onClick={() => setAutoRestored(null)}>✕</Btn>
        </div>
      )}
      {updateNotice && (
        <div className="mb-3 bg-cyan-50 border border-cyan-300 text-cyan-900 text-sm rounded px-3 py-2 flex items-center gap-2 flex-wrap">
          🔄 {updateNotice.msg}<span className="text-xs text-slate-500">{updateNotice.at}</span>
          <Btn variant="ghost" onClick={() => setUpdateNotice(null)}>✕</Btn>
        </div>
      )}
      {recoveryNotice && (
        <div className="mb-3 bg-sky-50 border border-sky-300 text-sky-800 text-sm rounded px-3 py-2 flex items-center gap-2 flex-wrap">
          ♻ 世代バックアップから案件 {recoveryNotice.recovered} 件を復旧しました。
          <Btn variant="ghost" onClick={() => setRecoveryNotice(null)}>✕</Btn>
        </div>
      )}

      {tab === "search" && <SearchTab q={q} setQ={setQ} sekisan={sekisan} zairyo={zairyo} settings={settings} docs={docs} market={market}
        onAddRow={addRowFrom} onShowHist={setHistItem} onShowDocs={setDocsItem} onShowPrice={showPrice} netQ={netQ} setNetQ={setNetQ} netEdited={netEdited} setNetEdited={setNetEdited} />}
      {tab === "bulk" && <BulkTab sekisan={sekisan} zairyo={zairyo} settings={settings} docs={docs} market={market} state={bulkState} setState={setBulkState} onAddRows={addRowsBulk} onShowDocs={setDocsItem} onShowPrice={showPrice} />}
      {tab === "case" && <CaseTab cur={cur} setCur={setCur} settings={settings} setSettings={setSettings} vendorList={vendorList} docs={docs} market={market} onShowDocs={setDocsItem} onShowPrice={showPrice}
        onSaveCase={saveCase} onNewCase={newCase} onPreview={() => setPreview(true)} onExportExcel={exportExcel} onExportMitsumori={exportMitsumori} savedMsg={savedMsg} />}
      {tab === "list" && <ListTab cases={cases} onOpen={openCase} onDup={dupCase} onDel={delCase} />}
      {tab === "settings" && <SettingsTab settings={settings} setSettings={setSettings} sekisan={sekisan} zairyo={zairyo} docs={docs} market={market}
        onReloadSekisan={loadSekisan} onImportZairyo={importZairyo} onExportAll={exportAll} onImportAll={importAll}
        zWatch={zWatch} mpack={mpack} onSetupZairyoWatch={setupZairyoWatch} onCheckZairyo={checkZairyoUpdate}
        onSetupMpack={setupMasterPackTarget} onWriteMpack={() => writeMasterPack("manual")} onExportMpack={exportMasterPack} onImportMpack={importMasterPack}
        fs={{ supported: fsSupported, name: fsName, ready: fsReady, lastWrite: fsLastWrite }} lastBackup={lastBackup} gens={gens}
        onSetupFs={setupAutoSaveTarget} onEnableFs={enableAutoSave} onFsWriteNow={() => fsWrite("manual")}
        onRestoreHandle={restoreFromHandle} onRestorePicker={restoreFromPicker} onRecoverGens={recoverFromGens} />}

      {histItem && <HistModal item={histItem} history={zairyo.history} onClose={() => setHistItem(null)} />}
      {docsItem && <DocsModal item={docsItem} docs={docs} settings={settings} onSaveDocs={saveDocs} onClose={() => setDocsItem(null)} />}
      {priceItem && <PriceModal item={priceItem.item} market={market} settings={settings} onSave={saveMarket} onAdopt={priceItem.onAdopt} onClose={() => setPriceItem(null)} />}

      {preview && (
        <div className="print-backdrop fixed inset-0 bg-black/50 z-40 overflow-auto p-4" onClick={() => setPreview(false)}>
          <div className="print-host mx-auto" style={{ maxWidth: "210mm" }} onClick={(e) => e.stopPropagation()}>
            <div className="no-print flex gap-1.5 justify-end mb-2">
              <label className="text-sm text-white flex items-center gap-1.5 mr-auto">
                <input type="checkbox" checked={!!settings.priceOnSheet} onChange={(e) => setSettings((s) => ({ ...s, priceOnSheet: e.target.checked }))} />参考単価を載せる
              </label>
              <Btn variant="primary" onClick={doPrint}>🖨 印刷（PDF保存）</Btn>
              <Btn onClick={() => setPreview(false)}>閉じる</Btn>
            </div>
            <RequestSheet cur={cur} settings={settings} showPrice={!!settings.priceOnSheet} />
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // 公開版（https）ではPWAとして動作させる：ホーム画面追加・オフライン起動用のキャッシュ。file:// では何もしない（manifestもfile://では取得できずエラーになるため付けない）
  if (location.protocol !== "file:") { var mf = document.createElement("link"); mf.rel = "manifest"; mf.href = "manifest.webmanifest"; document.head.appendChild(mf); }
  if ((location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1") && "serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
</body>
</html>
